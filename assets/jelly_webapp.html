<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JellyColor WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f12;
            --container-bg: #16161e;
            --accent-color: #5856d6;
            --text-color: #f5f5f7;
            --muted-color: #8e8e93;
            --border-color: #2c2c35;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--container-bg);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .preview-card {
            width: 100%;
            height: 160px;
            background: #1e1e2a;
            border-radius: 18px;
            border: 1px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .preview-text {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            background-size: 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.2s ease;
        }
        .tabs {
            display: flex;
            background: #252530;
            border-radius: 12px;
            padding: 4px;
        }
        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            color: var(--muted-color);
        }
        .tab.active {
            background-color: var(--accent-color);
            color: #fff;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1e1e2a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
        }
        .input-row label {
            font-size: 14px;
            color: var(--muted-color);
            flex: 1;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border-color);
            border-radius: 50%;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            font-family: monospace;
            font-size: 16px;
            width: 100px;
            text-align: right;
            outline: none;
        }
        .select-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e2a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
        }
        .select-row select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .apply-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px 0;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
        }
        .apply-btn:hover {
            opacity: 0.9;
        }
        .status-msg {
            text-align: center;
            font-size: 14px;
            color: #34c759;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="preview-card">
            <div id="previewText" class="preview-text">Aa</div>
        </div>

        <div class="tabs">
            <div id="tabSolid" class="tab active" onclick="switchTab('solid')">Цвет</div>
            <div id="tabGrad" class="tab" onclick="switchTab('gradient')">Градиент</div>
        </div>

        <!-- Solid Color Controls -->
        <div id="solidControls" class="control-group">
            <div class="input-row">
                <label>Выберите цвет</label>
                <input type="color" id="solidColor" value="#ff3b30" oninput="updateSolid()">
                <input type="text" id="solidHex" value="#FF3B30" oninput="updateSolidHex()">
            </div>
        </div>

        <!-- Gradient Controls -->
        <div id="gradientControls" class="control-group" style="display: none;">
            <div class="input-row">
                <label>Начальный цвет</label>
                <input type="color" id="gradStart" value="#007aff" oninput="updateGradient()">
            </div>
            <div class="input-row">
                <label>Конечный цвет</label>
                <input type="color" id="gradEnd" value="#ff2d55" oninput="updateGradient()">
            </div>
            <div class="select-row">
                <span>Направление</span>
                <select id="gradDir" onchange="updateGradient()">
                    <option value="d">По диагонали</option>
                    <option value="h">По горизонтали</option>
                    <option value="v">По вертикали</option>
                </select>
            </div>
        </div>

        <button class="apply-btn" onclick="applyColor()">Применить</button>
        <div id="statusMsg" class="status-msg">Применено! Закрываем окно...</div>
    </div>

    <script>
        let currentTab = 'solid';
        const urlParams = new URLSearchParams(window.location.search);
        const session = urlParams.get('session');
        const textParam = urlParams.get('text') || 'Aa';
        const typeParam = urlParams.get('type') || 'sticker';
        const bucket = 'YcC7nWdjH2RBSzkYZhq6Ye';

        // Set preview text
        document.getElementById('previewText').innerText = textParam;
        
        // Initialize WebApp
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabSolid').classList.toggle('active', tab === 'solid');
            document.getElementById('tabGrad').classList.toggle('active', tab === 'gradient');
            
            document.getElementById('solidControls').style.display = tab === 'solid' ? 'flex' : 'none';
            document.getElementById('gradientControls').style.display = tab === 'gradient' ? 'flex' : 'none';
            
            if (tab === 'solid') {
                updateSolid();
            } else {
                updateGradient();
            }
        }

        function updateSolid() {
            const color = document.getElementById('solidColor').value;
            document.getElementById('solidHex').value = color.toUpperCase();
            
            const preview = document.getElementById('previewText');
            preview.style.backgroundImage = 'none';
            preview.style.webkitTextFillColor = color;
        }

        function updateSolidHex() {
            let hex = document.getElementById('solidHex').value;
            if (!hex.startsWith('#')) hex = '#' + hex;
            if (/^#[0-9A-F]{6}$/i.test(hex)) {
                document.getElementById('solidColor').value = hex;
                const preview = document.getElementById('previewText');
                preview.style.backgroundImage = 'none';
                preview.style.webkitTextFillColor = hex;
            }
        }

        function updateGradient() {
            const start = document.getElementById('gradStart').value;
            const end = document.getElementById('gradEnd').value;
            const dir = document.getElementById('gradDir').value;
            
            let angle = '135deg';
            if (dir === 'h') angle = 'to right';
            if (dir === 'v') angle = 'to bottom';
            
            const preview = document.getElementById('previewText');
            preview.style.webkitTextFillColor = 'transparent';
            preview.style.backgroundImage = `linear-gradient(${angle}, ${start}, ${end})`;
        }

        async function applyColor() {
            if (!session) {
                alert('Ошибка: сессия не найдена.');
                return;
            }
            
            let resultValue = '';
            if (currentTab === 'solid') {
                resultValue = document.getElementById('solidColor').value.toUpperCase();
            } else {
                const start = document.getElementById('gradStart').value.toUpperCase();
                const end = document.getElementById('gradEnd').value.toUpperCase();
                const dir = document.getElementById('gradDir').value;
                resultValue = `grad:custom:${dir}:${start},${end}`;
            }

            document.getElementById('statusMsg').style.display = 'block';

            try {
                const response = await fetch(`https://kvdb.io/${bucket}/${session}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: resultValue
                });
                
                if (response.ok) {
                    setTimeout(() => {
                        Telegram.WebApp.close();
                    }, 500);
                } else {
                    alert('Не удалось отправить данные. Попробуйте еще раз.');
                }
            } catch (err) {
                alert('Ошибка соединения: ' + err.message);
            }
        }

        // Initialize preview
        updateSolid();
    </script>
</body>
</html>
